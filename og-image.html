<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CrewCase OG Image</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      background: #FFFFFF;
      color: #1C1C1E;
      -webkit-font-smoothing: antialiased;
    }

    .canvas {
      position: relative;
      width: 1200px;
      height: 630px;
      display: flex;
      overflow: hidden;
      background: linear-gradient(to right, #FFFFFF 0%, #FFFFFF 58%, #F5F5F7 58%);
    }

    /* Left column */
    .left {
      width: 696px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 64px 56px 64px 80px;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 40px;
    }

    .logo-row img {
      width: 52px; height: 52px;
      border-radius: 12px;
      display: block;
    }

    .logo-name {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    h1 {
      font-size: 68px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.02;
      margin-bottom: 24px;
    }

    h1 em {
      font-style: normal;
      color: #6E6E73;
    }

    .sub {
      font-size: 22px;
      color: #636366;
      line-height: 1.45;
      margin-bottom: 32px;
      max-width: 500px;
    }

    .pills {
      display: flex;
      gap: 10px;
    }

    /* Status colors match the app's badge tokens. IN has no color. */
    .pill {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .p-in      { background: rgba(120,120,128,0.12); color: #636366; }
    .p-out     { background: #E6F0FD; color: #0B5CC2; }
    .p-overdue { background: #FDE7E7; color: #B3151B; }
    .p-maint   { background: #EEEAFB; color: #5B45B8; }

    /* Right column: phone bleeds off the bottom edge */
    .right {
      flex: 1;
      position: relative;
    }

    .iphone {
      position: absolute;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      border-radius: 50px;
      background: #000;
      box-shadow:
        0 0 0 7px #1C1C1E,
        0 0 0 8px rgba(0,0,0,0.25),
        0 36px 72px rgba(0,0,0,0.16),
        0 10px 24px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .iphone img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="canvas">

    <div class="left">
      <div class="logo-row">
        <img src="crewcase-icon.svg" alt="" />
        <div class="logo-name">CrewCase</div>
      </div>

      <h1>Know exactly where your <em>gear</em> is.</h1>

      <p class="sub">Track every item your crew checks out, scan QR codes, and get alerts before anything goes overdue.</p>

      <div class="pills">
        <span class="pill p-in">IN</span>
        <span class="pill p-out">OUT</span>
        <span class="pill p-overdue">OVERDUE</span>
        <span class="pill p-maint">MAINT</span>
      </div>
    </div>

    <div class="right">
      <div class="iphone">
        <img src="screen-today.png" alt="CrewCase Today screen" />
      </div>
    </div>

  </div>
</body>
</html>
